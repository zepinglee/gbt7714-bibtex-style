name: Test

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    # Run every Monday and Friday at 00:42. The time has been chosen at random.
    - cron: '42 0 * * 1,5'
  workflow_dispatch:

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages

      - name: Test
        run: make test

      - name: Test doc
        run: make doc

  test-historic:
    name: Test with TeX Live ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 2026
          - 2025
          - 2024
          - 2023
          - 2022
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up TeX Live
        uses: zauguin/install-texlive@main
        with:
          texlive_version: ${{ matrix.version }}
          package_file: .github/tl_packages

      - name: Test
        run: latexmk -xelatex gbt7714-example.tex
